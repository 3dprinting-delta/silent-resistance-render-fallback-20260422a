<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aug & Ach AI Shop Search</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Aug & Ach custom finder</p>
          <h1>Find a 3D print, or start a custom one.</h1>
          <p class="lede">Search ready-to-order pieces by idea, use case, gift, shape, color, or vibe.</p>
        </div>
        <form class="search" data-search-form>
          <input data-search-input name="q" type="search" placeholder="Try “dragon gift”, “desk organizer”, or “custom name plate”" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
      </section>
      <section class="results" data-results></section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
